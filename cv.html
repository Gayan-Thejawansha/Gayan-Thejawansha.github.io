<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        :root { --primary-color: #0563bb; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.5; color: #333; max-width: 850px; margin: 40px auto; padding: 20px; background: #f4f4f4; }
        .cv-container { background: #fff; padding: 50px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        header { text-align: center; margin-bottom: 30px; }
        h1 { margin: 0; color: var(--primary-color); }
        .contact-info { text-align: center; font-size: 0.9em; color: #666; margin-bottom: 20px; }
        h2 { border-bottom: 2px solid var(--primary-color); padding-bottom: 5px; margin-top: 30px; color: var(--primary-color); text-transform: uppercase; font-size: 1.2em; }
        .item { margin-bottom: 15px; }
        .item-header { display: flex; justify-content: space-between; font-weight: bold; }
        .item-subheader { font-style: italic; color: #555; }
        .tech-stack { font-size: 0.85em; color: #444; margin-top: 5px; margin-bottom: 10px; }
        ul { padding-left: 20px; }
        li { margin-bottom: 5px; }
        .no-print { text-align: center; margin-bottom: 20px; }
        button { padding: 10px 20px; background: var(--primary-color); color: #fff; border: none; cursor: pointer; border-radius: 5px; }
        @media print {
            body { background: #fff; margin: 0; padding: 0; }
            .cv-container { box-shadow: none; padding: 0; }
            .no-print { display: none; }
        }
    </style>
</head>

                <div class="item">

        const certContainer = document.getElementById('certifications');
        data.certifications.forEach(cert => {
            certContainer.innerHTML += `<div class="item"><strong>${cert.name}</strong> - ${cert.issuer}</div>`;

        const eduContainer = document.getElementById('education');
        data.education.forEach(edu => {
            eduContainer.innerHTML += `

</body>
</html>
